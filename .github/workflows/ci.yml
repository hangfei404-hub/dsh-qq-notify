name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dev dependency (schemastery)
        run: npm ci

      - name: Run tests
        run: npm test
        # smtp.mjs 会在回环地址起一个真实 SMTP 服务器，需要 openssl（ubuntu 自带）

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject committed credentials
        run: |
          set -e
          # 凭证文件、私钥、真实授权码形态一律不许进仓库
          if git ls-files | grep -Ei '(^|/)\.credentials|(^|/)secrets?\.|\.pem$|\.key$'; then
            echo "::error::发现疑似凭证文件，请从仓库移除"
            exit 1
          fi
          if git grep -nEi 'sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}' -- . ':!package-lock.json'; then
            echo "::error::发现疑似密钥字面量"
            exit 1
          fi
          echo "OK: 未发现凭证文件或密钥字面量"
